<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Відкрити Viber</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; margin-top: 60px; }
  a.btn { display: inline-block; margin: 8px; padding: 12px 20px; background: #7360f2;
          color: #fff; border-radius: 6px; text-decoration: none; }
</style>
</head>
<body>
<h3 id="title">Відкриваю Viber…</h3>
<p id="num"></p>
<p id="btns"></p>
<script>
  var CLOSE_DELAY_MS = 1500;   // скільки чекати перед закриттям вкладки

  var n = (location.hash || '').replace(/\D/g, '');
  var title = document.getElementById('title');

  if (n.length >= 11 && n.length <= 15) {
    var url = 'viber://chat?number=' + n;
    document.getElementById('num').textContent = '+' + n;
    document.getElementById('btns').innerHTML =
      '<a class="btn" href="' + url + '">Відкрити Viber</a>';

    location.href = url;

    setTimeout(function () {
      window.close();
      // якщо браузер не дозволив закрити вкладку
      setTimeout(function () {
        title.textContent = 'Viber відкрито. Цю вкладку можна закрити.';
      }, 300);
    }, CLOSE_DELAY_MS);
  } else {
    title.textContent = 'Номер не вказано або він некоректний';
  }
</script>
</body>
</html>
